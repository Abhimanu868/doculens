services:
  - type: web
    name: doculens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: 1c-2g
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HF_MODEL_ID
        value: Abhimanyu125047/doculens-nli
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: NLI_CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: doculens-frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    autoDeployTrigger: commit
    envVars:
      # NEXT_PUBLIC_API_URL is inlined at build time; redeploy after changing it.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"